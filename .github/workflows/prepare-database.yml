name: Prepare meme database

on:
  push:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - translate
      language:
        description: Target language code
        required: true
        default: es
        type: string
      limit:
        description: Maximum posts to translate (-1 for all)
        required: true
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check database
        id: database
        shell: bash
        run: |
          if [ -f memes.db ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "memes.db already exists; nothing to generate."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.database.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'translate')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        if: steps.database.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'translate')
        run: python -m pip install requests

      - name: Generate complete database
        if: steps.database.outputs.exists == 'false'
        run: python meme_scraper.py --no-translate --delay 0.05 --limit -1

      - name: Translate database
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'translate'
        env:
          TARGET_LANGUAGE: ${{ inputs.language }}
          TRANSLATION_LIMIT: ${{ inputs.limit }}
        run: python meme_scraper.py --translate-only --lang "$TARGET_LANGUAGE" --delay 0.1 --limit "$TRANSLATION_LIMIT"

      - name: Commit database to branch
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f memes.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi
          if [ "$OPERATION" = "translate" ]; then
            git commit -m "Translate meme database"
          else
            git commit -m "Generate meme database"
          fi
          git push
